<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>Tomcat 节点 2</title>
  <style>
    body { margin: 0; height: 100vh; display: flex; flex-direction: column;

           font-family: "Microsoft YaHei", Arial, sans-serif;

    .card { text-align: center; padding: 48px 72px; border-radius: 16px;

    <h1>Tomcat 节点 2</h1>
