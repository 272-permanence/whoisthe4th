openapi: 3.0.3
info:
  title: 景区导览 AI 数字人 · 后端接口文档
  version: 1.0.0
  license:
    name: 第八组课程项目（内部使用）
  description: |
    第八组项目后端接口契约（OpenAPI 3.0.3）。

    ## 基础信息
    - 基础地址：`http://localhost:8000`（本地开发），所有业务接口前缀为 `/api/v1`
    - 鉴权：当前版本**无鉴权**，接口默认允许前端地址跨域（CORS 白名单为 `FRONTEND_URL`，默认 `http://localhost:5173`）
    - 字符编码：UTF-8

    ## 通用响应包络
    除 `/api/v1/chat/stream` 外，业务接口统一返回：

    ```json
    { "code": 0, "message": "ok", "data": {} }
    ```

    - `code` 为 `0` 表示成功；非 `0` 表示业务错误
    - **已知不一致**：`/api/v1/chat/stream` 的错误体为 `{ "error": "..." }`；`/api/v1/analytics/log` 的参数错误码为 `10001`（不在统一错误码表内）；`/api/v1/kb/*` 的 `code` 直接复用 HTTP 状态码（400/404/413）。对接时请按各接口的实际定义处理。

    ## 统一错误码
    | code | 含义 |
    | --- | --- |
    | 40001 | 参数校验失败 |
    | 40002 | 上传文件缺失或类型不合法 |
    | 40003 | 上传文件超出体积上限 |
    | 50000 | 未预期的服务端异常 |
    | 50001 | 语音识别服务不可用 |
    | 50002 | 语音合成服务不可用 |

    ## SSE（Server-Sent Events）约定
    流式接口的响应类型均为 `text/event-stream`，格式为：

    ```
    event: <事件名>
    data: <JSON 负载>

    ```

    各流式接口的事件名与负载见对应接口说明。心跳保活为注释行（以 `:` 开头），客户端应忽略。
    - 语音合成支持断线续传：通过 `lastSeq` 查询参数跳过已收到的音频分片
servers:
  - url: http://localhost:8000
    description: 本地开发环境
security: []
tags:
  - name: 健康检查
    description: 服务存活探测
  - name: 智能问答
    description: 基于大模型的流式对话（DashScope）
  - name: 数据分析
    description: 交互埋点采集、统计聚合与实时推送
  - name: 语音交互
    description: 语音识别（ASR）与语音合成（TTS）
  - name: 知识库管理
    description: 景区资料上传、异步入库、向量检索与文档管理

paths:
  /health:
    get:
      tags: [健康检查]
      summary: 健康检查
      description: 探测后端服务是否存活，用于部署与联调自检。
      operationId: getHealth
      responses:
        '200':
          description: 服务正常运行
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: 景区导览 AI 后端 (Node.js) 运行中

  /api/v1/chat/stream:
    post:
      tags: [智能问答]
      summary: 流式对话（SSE）
      description: |
        向大模型发起流式对话，逐 token 推送生成结果。

        **入参二选一**：
        - 单轮：`{ "message": "..." }`（服务端自动补充景区导览 system 提示词）
        - 多轮：`{ "messages": [{ "role": "system|user|assistant", "content": "..." }] }`

        **SSE 事件**：
        | event | data | 说明 |
        | --- | --- | --- |
        | `token` | `{ "content": "增量文本" }` | 逐段返回的生成内容，需拼接；每条事件另带 `id: <序号>`（自 0 递增） |
        | `done` | `{ "fullContent": "完整回答" }` | 生成正常结束，另带 `id: <序号>` |
        | `error` | `{ "message": "错误原因" }` | 生成异常结束，其后仍会补发 `done`，**此时 `done` 的负载为空对象 `{}`**（而非 `{ "fullContent" }`） |

        心跳为注释行（以 `:` 开头，`: heartbeat`，每 25 秒一次），客户端应忽略。
      operationId: chatStream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ChatSingleTurnRequest'
                - $ref: '#/components/schemas/ChatMultiTurnRequest'
      responses:
        '200':
          description: SSE 流（`text/event-stream`），事件见接口说明
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: token
                id: 0
                data: {"content":"西湖"}

                event: done
                id: 1
                data: {"fullContent":"西湖位于浙江省杭州市。"}

        '400':
          description: 未提供 `message` 或 `messages`
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 请提供 message (string) 或 messages (array) 参数

  /api/v1/analytics/log:
    post:
      tags: [数据分析]
      summary: 上报交互埋点
      description: 前端上报一次问答交互，服务端做情感分析并落库，返回记录 ID 与情感判定。
      operationId: createAnalyticsLog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsLogRequest'
      responses:
        '200':
          description: 上报成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AnalyticsLogResult'
        '400':
          description: 缺少必填参数
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 10001
                  message:
                    type: string
                    example: userId 和 message 不能为空

  /api/v1/analytics/stats:
    get:
      tags: [数据分析]
      summary: 获取统计数据
      description: 前端看板初次加载时拉取一次全量统计快照。
      operationId: getAnalyticsStats
      responses:
        '200':
          description: 统计快照
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AnalyticsStats'

  /api/v1/analytics/stream:
    get:
      tags: [数据分析]
      summary: 实时统计数据推送（SSE）
      description: |
        建立长连接后先下发 `connected` 确认帧，**随即立即推送一次**当前统计，此后由服务端每 5 秒广播一次。

        **SSE 事件**：
        | event | data | 说明 |
        | --- | --- | --- |
        | `connected` | `{ "id": "uuid" }` | 建连确认帧，`id` 为服务端为本次连接生成的客户端标识（`randomUUID()`），先于所有 `stats` 下发 |
        | `stats` | `AnalyticsStats` | 统计数据快照，结构同 `GET /api/v1/analytics/stats` 的 `data` |

        心跳为注释行（以 `:` 开头，内容形如 `: heartbeat <ISO 时间>`，每 15 秒一次），客户端应忽略。
        客户端断开后由服务端自动清理，无需额外调用。
      operationId: streamAnalyticsStats
      responses:
        '200':
          description: SSE 流（`text/event-stream`）
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: connected
                data: {"id":"3f2b9c1a-7d4e-4b8f-9a10-5c6d7e8f9012"}

                event: stats
                data: {"totalVisits":12,"todayVisits":3,"sentimentDist":{"positive":7,"neutral":4,"negative":1}}

                : heartbeat 2026-10-20T09:15:00.000Z

                event: stats
                data: {"totalVisits":13,"todayVisits":4,"sentimentDist":{"positive":8,"neutral":4,"negative":1}}

  /api/v1/asr-tts/asr:
    post:
      tags: [语音交互]
      summary: 语音识别（音频转文字）
      description: |
        上传音频文件，返回识别出的文本。

        允许的 MIME 类型白名单：`audio/wav`、`audio/x-wav`、`audio/wave`、`audio/mpeg`、`audio/mp3`、`audio/webm`、`audio/ogg`、`audio/mp4`、`audio/x-m4a`。
        文件在内存中处理，不落盘。
      operationId: transcribeAudio
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: 音频文件，字段名固定为 `audio`
            encoding:
              audio:
                contentType: audio/wav, audio/mpeg, audio/webm, audio/ogg, audio/mp4
      responses:
        '200':
          description: 识别成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AsrResult'
        '400':
          description: 缺少 audio 字段，或音频类型不在白名单内
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      code:
                        type: integer
                        example: 40002
        '500':
          description: 语音识别服务不可用
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      code:
                        type: integer
                        example: 50001

  /api/v1/asr-tts/tts/stream:
    get:
      tags: [语音交互]
      summary: 语音合成（SSE 流式返回音频分片）
      description: |
        将文本合成为语音，以 SSE 流式推送音频分片（Base64 编码）。

        `text` 通过查询参数传入（因 `EventSource` 只支持 GET，无法携带请求体），长度上限 **500** 字符。

        **断线续传**：携带 `lastSeq` 可跳过序号小于等于该值的分片，实现重连后继续播放。

        **SSE 事件**：
        | event | data | 说明 |
        | --- | --- | --- |
        | `meta` | `{ "streamId", "text", ...音色/采样率等元信息 }` | 流开始，先于所有音频分片下发 |
        | `audio` | `{ "seq": 1, "chunk": "<base64>", "byteLength": 8192 }` | 音频分片，带 `id` 字段（等于 seq）用于续传 |
        | `done` | `{ "streamId", "totalChunks", "provider" }` | 合成正常结束 |
        | `error` | `{ "code": 50002, "message": "..." }` | 合成异常结束 |
      operationId: streamTts
      parameters:
        - name: text
          in: query
          required: true
          description: 待合成文本，长度不超过 500 字符
          schema:
            type: string
            maxLength: 500
        - name: lastSeq
          in: query
          required: false
          description: 断线续传起点，跳过序号 ≤ 该值的音频分片，缺省为 0
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: SSE 流（`text/event-stream`）
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: meta
                data: {"streamId":"...","text":"西湖","provider":"mock","sampleRate":24000}

                id: 1
                event: audio
                data: {"seq":1,"chunk":"UklGR...","byteLength":8192}

                event: done
                data: {"streamId":"...","totalChunks":3,"provider":"mock"}

        '400':
          description: text 为空或超长
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      code:
                        type: integer
                        example: 40001

  /api/v1/kb/documents:
    post:
      tags: [知识库管理]
      summary: 上传文档并触发异步入库
      description: |
        上传景区资料文件，服务端**立即返回任务标识**，解析/切分/向量化在后台进行。

        前端应随后调用 `GET /api/v1/kb/tasks/{taskId}/progress` 建立 SSE 连接订阅进度。

        允许的扩展名：`.pdf`、`.docx`、`.txt`、`.md`；文件体积上限 **50 MB**。
        分块参数：块大小 800 字符、重叠 120 字符。
      operationId: uploadKbDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 待入库文档，字段名固定为 `file`
      responses:
        '202':
          description: 文件已接收，后台解析中
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 文件已接收，正在后台解析
                      data:
                        $ref: '#/components/schemas/KbUploadResult'
        '400':
          description: 未接收到文件，或文件类型不支持
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbErrorResponse'
        '413':
          description: 文件超过 50 MB 上限
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/KbErrorResponse'
                  - type: object
                    properties:
                      code:
                        type: integer
                        example: 413
                      message:
                        type: string
                        example: 文件超过 50MB 上限

    get:
      tags: [知识库管理]
      summary: 查询知识库文档列表
      description: 返回当前已入库（含处理中、失败）的全部文档元数据。
      operationId: listKbDocuments
      responses:
        '200':
          description: 文档列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: ok
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/KbDocument'

  /api/v1/kb/tasks/{taskId}:
    get:
      tags: [知识库管理]
      summary: 查询入库任务快照
      description: 主动查询某个入库任务的当前状态（SSE 之外的轮询兜底方式）。
      operationId: getKbTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 任务快照
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/KbParseTask'
        '404':
          description: 任务不存在或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbErrorResponse'

  /api/v1/kb/tasks/{taskId}/progress:
    get:
      tags: [知识库管理]
      summary: 订阅入库进度（SSE）
      description: |
        订阅指定任务的入库进度，连接建立后**立即推送一帧当前状态**，此后状态变化即推送，直至 `done` 或 `failed` 后服务端主动关闭连接。

        心跳：每 15 秒发送一次注释行（以 `:` 开头），客户端应忽略。

        **SSE 事件**：
        | event | data | 说明 |
        | --- | --- | --- |
        | `progress` | `KbProgressEvent` | 进度快照，`percent` 为整体百分比（0-100） |

        阶段与百分比对应关系：`uploading` 2% → `parsing` 30% → `chunking` 50% → `embedding` 80% → `indexing` 95% → `done` 100%。
      operationId: streamKbTaskProgress
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: SSE 流（`text/event-stream`）
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: progress
                data: {"percent":50,"stage":"chunking","message":"正在切分知识块","chunkCount":0,"fileName":"guide.md","documentId":"a02f..."}

                event: progress
                data: {"percent":100,"stage":"done","message":"知识库已更新，数字人可立即检索到新内容","chunkCount":4,"fileName":"guide.md","documentId":"a02f..."}

        '404':
          description: 任务不存在或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbErrorResponse'

  /api/v1/kb/documents/{documentId}:
    delete:
      tags: [知识库管理]
      summary: 删除文档及其向量
      description: 从知识库移除文档，同时清理该文档在向量库中的全部知识块。
      operationId: deleteKbDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '404':
          description: 文档不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbErrorResponse'

  /api/v1/kb/documents/{documentId}/reindex:
    post:
      tags: [知识库管理]
      summary: 重建文档索引
      description: |
        使用磁盘上的原始文件重新执行解析、切分与向量化，进度复用与上传相同的 SSE 通道。

        典型用途：文档处理失败后重试，或更换向量模型 / 向量库后重建索引。
      operationId: reindexKbDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '202':
          description: 已开始重建索引，返回新任务标识
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 已开始重建索引
                      data:
                        $ref: '#/components/schemas/KbUploadResult'
        '404':
          description: 文档不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbErrorResponse'

  /api/v1/kb/search:
    post:
      tags: [知识库管理]
      summary: 知识库语义检索
      description: |
        按语义相似度检索知识块，返回 Top-K 命中结果，供对话链路的 RAG 复用，也可用于人工自检。

        **当前检索质量提示**：若未配置 `EMBEDDING_API_URL`，服务端使用「本地确定性伪向量」兜底实现，此时 `score` 不具备语义意义；同时默认分块策略对小文件会产出极少的知识块（整篇可能只有 1 块），导致不同 query 命中同一段文本。需接入真实向量模型后检索质量才可评估。
      operationId: searchKb
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: 查询文本
                  example: 雷峰塔在哪里
                topK:
                  type: integer
                  description: 返回结果条数，缺省为 5
                  default: 5
                  minimum: 1
      responses:
        '200':
          description: 命中结果（按相似度降序）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: ok
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/KbSearchHit'
        '400':
          description: query 为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbErrorResponse'

components:
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      description: 入库任务标识，由上传接口或重建索引接口返回
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      description: 文档标识，由文档列表接口返回
      schema:
        type: string
        format: uuid

  schemas:
    ApiResult:
      type: object
      description: 统一响应包络（`code` 为 0 表示成功）
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          type: object
          description: 业务数据，具体结构见各接口

    ErrorResponse:
      type: object
      description: 通用错误响应
      properties:
        code:
          type: integer
        message:
          type: string

    KbErrorResponse:
      type: object
      description: |
        知识库模块错误响应。注意：该模块的 `code` **复用 HTTP 状态码**（400 / 404 / 413），
        与其他模块使用的业务错误码（40001 等）不一致。
      properties:
        code:
          type: integer
          example: 404
        message:
          type: string
          example: 文档不存在

    ChatSingleTurnRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: 单轮提问内容，服务端自动补充景区导览 system 提示词
          example: 介绍一下西湖

    ChatMultiTurnRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          description: 多轮对话上下文，按时间顺序排列
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [system, user, assistant]
              content:
                type: string

    AnalyticsLogRequest:
      type: object
      required: [userId, message]
      properties:
        userId:
          type: string
          description: 用户标识
        message:
          type: string
          description: 用户提问内容，参与情感分析
        response:
          type: string
          description: 数字人的回复内容（可选）
        scenicSpot:
          type: string
          description: 关联景区名称（可选）

    AnalyticsLogResult:
      type: object
      properties:
        id:
          type: integer
          description: 埋点记录自增主键
        sentimentScore:
          type: number
          description: 情感得分
        sentimentLabel:
          type: string
          enum: [positive, neutral, negative]
          description: 情感标签

    AnalyticsStats:
      type: object
      properties:
        totalVisits:
          type: integer
          description: 累计服务人次
        todayVisits:
          type: integer
          description: 今日服务人次
        sentimentDist:
          type: object
          description: 情感分布计数
          properties:
            positive:
              type: integer
            neutral:
              type: integer
            negative:
              type: integer
        hotQuestions:
          type: array
          description: 热门问答 TOP10
          items:
            type: object
            properties:
              message:
                type: string
              count:
                type: integer
        hourlyTrend:
          type: array
          description: 近 24 小时问答量趋势，缺数小时补 0，共 24 个点
          items:
            type: object
            properties:
              hour:
                type: string
                example: "15:00"
              count:
                type: integer
        updatedAt:
          type: string
          format: date-time
          description: 统计生成时间（ISO 8601）

    AsrResult:
      type: object
      description: 语音识别结果
      additionalProperties: true
      properties:
        text:
          type: string
          description: 识别出的文本

    KbUploadResult:
      type: object
      description: 上传 / 重建索引后返回的任务与文档标识
      properties:
        taskId:
          type: string
          format: uuid
          description: 任务标识，用于订阅 SSE 进度
        documentId:
          type: string
          format: uuid
          description: 文档标识

    KbDocumentStatus:
      type: string
      enum: [processing, ready, failed]
      description: 文档状态：处理中 / 可检索 / 失败

    KbDocument:
      type: object
      description: 知识库文档元数据
      properties:
        documentId:
          type: string
          format: uuid
        fileName:
          type: string
          description: 原始文件名
        extension:
          type: string
          example: md
        sizeBytes:
          type: integer
          description: 文件体积（字节）
        charCount:
          type: integer
          description: 解析出的字符数
        pageCount:
          type: integer
          description: 页数（PDF/Word 才有意义）
        chunkCount:
          type: integer
          description: 知识块数量
        status:
          $ref: '#/components/schemas/KbDocumentStatus'
        createdAt:
          type: integer
          description: 入库时间（毫秒时间戳）
        updatedAt:
          type: integer
          description: 最近更新时间（毫秒时间戳）

    KbParseTask:
      type: object
      description: |
        入库任务快照。

        `GET /api/v1/kb/tasks/{taskId}/progress` 的 SSE `progress` 事件负载与该结构一致，只是不含 `taskId`
        （即 `documentId`、`fileName`、`stage`、`percent`、`message`、`chunkCount`、`error`）。
      properties:
        taskId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        fileName:
          type: string
        stage:
          type: string
          enum: [uploading, parsing, chunking, embedding, indexing, done, failed]
          description: 当前阶段
        percent:
          type: integer
          minimum: 0
          maximum: 100
          description: 整体进度百分比
        message:
          type: string
          description: 人类可读的阶段描述
        chunkCount:
          type: integer
          description: 已生成的知识块数量
        error:
          type: string
          description: 失败原因（仅 stage 为 failed 时存在）

    KbSearchHit:
      type: object
      description: 检索命中的知识块
      properties:
        id:
          type: string
          description: 知识块标识
        documentId:
          type: string
          format: uuid
          description: 所属文档标识
        text:
          type: string
          description: 知识块文本内容
        score:
          type: number
          description: 相似度得分，越大越相关（伪向量兜底时无意义）
